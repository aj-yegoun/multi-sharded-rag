dataset:
  name: trec-covid
  raw_data_dir: data/raw/beir
  embedding_dir: data/embeddings/trec-covid

output:
  result_dir: results/full/trec-covid
  filename_prefix: trec_covid_ablation_minibatch_no_doc_recall

experiment:
  seed: 42
  num_shards: [32]
  shard_types: [topic_based, heterogeneous]
  top_b_values: [1, 3, 5, 10]
  centroid_k_values: [2, 4, 8]

  embedding_batch_size: 65536
  multi_centroid_batch_size: 8192

  grouping:
    enabled: true
    num_groups: [4]
    num_selected_groups: [1, 2, 3]

metrics:
  document_recall_k_values: []
  document_recall_batch_size: 65536

clustering:
  algorithm: minibatch_kmeans
  random_state: 42
  n_init: auto
  batch_size: 65536